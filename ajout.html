<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une voiture | Garage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>AJOUTER UNE NOIVELLE VOITURE</h1>
<p class="subtitle">semaine 2 formulaire dynamique</p>
<div style="margin-bottom: 15px;">
<a href="ajout.html" style="display: inline-block; padding: 10px 20px; background-color: #ff4757; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; margin-bottom: 20px;">Ajouter une voiture ➕</a>

</div>
</header>
<main class="timeline">
<article class="entry">
<div class="content">
<form method="POST">
<label> Marque :</label>
<input type="text" name="marque" required style="width: 100%; padding: 8px; margin-top: 5px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;">
<label> Modele :</label>
<input type="text" name="modele" required style="width: 100%; padding: 8px; margin-top: 5px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;">
<label>Puissance (en ch) :</label>
<input type="number" name="puissance" required style="width: 100%; padding: 8px; margin-top: 5px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;">
<label> L'anne de la voiture :</label>
<input type="number" name="année" required style="width: 100%; padding: 8px; margin-top: 5px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;">
<label> Prix en (€) :</label>
<input type="number" name="prix" required style="width: 100%; padding: 8px; margin-top: 5px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;">
<label>Description :</label>
<textarea name="description" required style="width: 100%; padding: 8px; margin-top: 5px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; height: 100px; resize: none;"></textarea>
<button type="submit" style="width: 100%; padding: 10px; margin-top: 20px; background: #ff4757; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Ajouter la voiture</button>

</form>
</div>
</article>
</main>



  
</body>
